<form id = 'uploadForm'>
	<label for="userToken">userToken:</label><br>
	<input type="text" id="userToken" name="iuserToken"><br>
	<label for="imageUpload">Image:</label><br>
	<input type="file" id="imageUpload" name="image"><br>
	<label for="songUpload">Song:</label><br>
	<input type="file" id="songUpload" name="song"><br>
	<input type="submit">
</form>

<script>
const form = document.getElementById('uploadForm');
const userToken = document.getElementById('userToken');
const imageUpload = document.getElementById('imageUpload');
const songUpload = document.getElementById('songUpload');
var lastRequest;

// From Google AI & https://stackoverflow.com/questions/36067767/how-do-i-upload-a-file-with-the-js-fetch-api
form.addEventListener('submit', async (event) => {
	event.preventDefault();

	var data = new FormData();

	data.append('title', 'Media upload');
	data.append('description', '...');
	data.append('image', imageUpload.files[0]);
	data.append('song', songUpload.files[0]);

	try {
		lastRequest = await fetch('/api/posts/', {
			method: 'POST',
			headers: {
				'Authorization': `Bearer ${userToken.value}`
			},
			body: data
		});

		if (lastRequest.ok) {
			console.log('File uploaded successfully');
		} else {
			console.error('File upload failed');
		}
	} catch (error) {
		console.error('Error during file upload:', error);
	}
});
</script>
